<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninjago Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101010, #292929);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 700px;
}

.card {
  background: #1c1c1c;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  text-align: center;
}

h1 {
  font-size: 36px;
  margin-top: 0;
}

h2 {
  font-size: 25px;
  line-height: 1.35;
}

p {
  font-size: 18px;
  line-height: 1.5;
}

.hidden {
  display: none;
}

.progress {
  color: #aaa;
  margin-bottom: 20px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  background: #353535;
  color: white;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #4a4a4a;
  transform: scale(1.01);
}

button:active {
  transform: scale(0.98);
}

.start-button {
  background: #e63946;
  font-weight: bold;
}

.start-button:hover {
  background: #ff4d5a;
}

.answer-button {
  text-align: left;
}

.correct {
  background: #16803c !important;
}

.wrong {
  background: #a51d2d !important;
}

.score {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0;
}

.result {
  font-size: 32px;
  font-weight: bold;
  margin: 20px 0;
}

.result-description {
  font-size: 19px;
}

.character-list {
  color: #bbb;
  font-size: 14px;
  margin-top: 20px;
}

@media (max-width: 500px) {
  .card {
    padding: 22px;
  }

  h1 {
    font-size: 29px;
  }

  h2 {
    font-size: 22px;
  }

  button {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HOME -->
  <div id="home" class="card">
    <h1>🥷 NINJAGO QUIZ 🥷</h1>

    <p>Think you know Ninjago?</p>

    <button class="start-button" onclick="startKnowledgeQuiz()">
      Ninjago Hard Lore Quiz
    </button>

    <button class="start-button" onclick="startPersonalityQuiz()">
      Which Ninjago Character Are You?
    </button>

    <div class="character-list">
      Arin • Sora • Wyldfyre • Euphrasia • Frak • Riyu •
      Lloyd • Nya • Cole • Jay • Zane • Kai
    </div>
  </div>


  <!-- KNOWLEDGE QUIZ -->
  <div id="knowledgeQuiz" class="card hidden">

    <div class="progress" id="knowledgeProgress"></div>

    <h2 id="knowledgeQuestion"></h2>

    <div id="knowledgeAnswers"></div>

  </div>


  <!-- KNOWLEDGE RESULT -->
  <div id="knowledgeResult" class="card hidden">

    <h1>🥷 Quiz Complete!</h1>

    <div class="score" id="knowledgeScore"></div>

    <p id="knowledgeMessage"></p>

    <button class="start-button" onclick="startPersonalityQuiz()">
      Which Ninjago Character Are You?
    </button>

    <button onclick="goHome()">
      Back to Home
    </button>

  </div>


  <!-- PERSONALITY QUIZ -->
  <div id="personalityQuiz" class="card hidden">

    <div class="progress" id="personalityProgress"></div>

    <h2 id="personalityQuestion"></h2>

    <div id="personalityAnswers"></div>

  </div>


  <!-- PERSONALITY RESULT -->
  <div id="personalityResult" class="card hidden">

    <h1>🥷 Your Ninjago Character</h1>

    <div class="result" id="characterResult"></div>

    <p class="result-description" id="characterDescription"></p>

    <button class="start-button" onclick="startPersonalityQuiz()">
      Try Again
    </button>

    <button onclick="goHome()">
      Back to Home
    </button>

  </div>

</div>


<script>

/* =========================================================
   QUIZ 1 — HARD NINJAGO LORE
========================================================= */

const knowledgeQuestions = [

  {
    question: "Which Serpentine tribe is led by Skales?",
    answers: ["Hypnobrai", "Fangpyre", "Constrictai", "Anacondrai"],
    correct: 0
  },

  {
    question: "Who created Zane?",
    answers: ["Cyrus Borg", "Dr. Julien", "Master Wu", "Ray"],
    correct: 1
  },

  {
    question: "Which of these is one of the original Golden Weapons?",
    answers: ["Sword of Fire", "Blade of Time", "Techno Blade", "Fang Blade"],
    correct: 0
  },

  {
    question: "Which ninja possesses the elemental power of Energy?",
    answers: ["Kai", "Lloyd", "Cole", "Jay"],
    correct: 1
  },

  {
    question: "What creature was responsible for the destruction of much of Ninjago City in the early Serpentine conflict?",
    answers: ["The Great Devourer", "The Preeminent", "Firstbourne", "The Overlord"],
    correct: 0
  },

  {
    question: "Who are Cole's parents?",
    answers: [
      "Ray and Maya",
      "Lou and Lilly",
      "Ed and Edna",
      "Garmadon and Misako"
    ],
    correct: 1
  },

  {
    question: "Who is Lloyd's mother?",
    answers: ["Maya", "Misako", "Mystaké", "Faith"],
    correct: 1
  },

  {
    question: "Who are Kai and Nya's parents?",
    answers: [
      "Lou and Lilly",
      "Ed and Edna",
      "Ray and Maya",
      "Garmadon and Misako"
    ],
    correct: 2
  },

  {
    question: "Which elemental master possesses the power of Amber?",
    answers: ["Skylor", "Shade", "Griffin Turner", "Karlof"],
    correct: 0
  },

  {
    question: "Which elemental master possesses the power of Metal?",
    answers: ["Neuro", "Karlof", "Gravis", "Bolobo"],
    correct: 1
  },

  {
    question: "Which elemental master possesses the power of Mind?",
    answers: ["Gravis", "Neuro", "Jacob", "Shade"],
    correct: 1
  },

  {
    question: "Who leads the Sons of Garmadon?",
    answers: ["Pythor", "Harumi", "Aspheera", "Vex"],
    correct: 1
  },

  {
    question: "What is Harumi's title within the Sons of Garmadon?",
    answers: ["The Quiet One", "The Ice Emperor", "The Skull Sorcerer", "The Golden Master"],
    correct: 0
  },

  {
    question: "Who is revealed to be the Ice Emperor?",
    answers: ["Lloyd", "Zane", "Vex", "Aspheera"],
    correct: 1
  },

  {
    question: "Which realm is the original home of the Oni and Dragons?",
    answers: [
      "The First Realm",
      "The Never-Realm",
      "The Departed Realm",
      "The Cursed Realm"
    ],
    correct: 0
  },

  {
    question: "Who is the leader of the Dragon Hunters?",
    answers: ["Faith", "Iron Baron", "Muzzard", "Heavy Metal"],
    correct: 1
  },

  {
    question: "What are the four weapons connected to the elemental power of Time called?",
    answers: [
      "The Golden Weapons",
      "The Fang Blades",
      "The Blades of Time",
      "The Techno Blades"
    ],
    correct: 2
  },

  {
    question: "Which Time Twin is the older brother?",
    answers: ["Acronix", "Krux", "Wu", "Ray"],
    correct: 1
  },

  {
    question: "Who created Prime Empire?",
    answers: ["Unagami", "Cyrus Borg", "Dr. Julien", "Master Chen"],
    correct: 0
  },

  {
    question: "Who is revealed to be the Skull Sorcerer?",
    answers: ["Vangelis", "Trimaar", "Aspheera", "Vex"],
    correct: 0
  }

];

let knowledgeIndex = 0;
let knowledgeScore = 0;


/* Start Knowledge Quiz */

function startKnowledgeQuiz() {

  hideAll();

  document
    .getElementById("knowledgeQuiz")
    .classList.remove("hidden");

  knowledgeIndex = 0;
  knowledgeScore = 0;

  showKnowledgeQuestion();
}


/* Show Knowledge Question */

function showKnowledgeQuestion() {

  const question =
    knowledgeQuestions[knowledgeIndex];

  document.getElementById("knowledgeProgress").textContent =
    "Question " +
    (knowledgeIndex + 1) +
    " of " +
    knowledgeQuestions.length;

  document.getElementById("knowledgeQuestion").textContent =
    question.question;

  const answers =
    document.getElementById("knowledgeAnswers");

  answers.innerHTML = "";

  question.answers.forEach(function(answer, index) {

    const button =
      document.createElement("button");

    button.className = "answer-button";

    button.textContent =
      String.fromCharCode(65 + index) +
      ". " +
      answer;

    button.onclick = function() {
      answerKnowledgeQuestion(index, button);
    };

    answers.appendChild(button);

  });
}


/* Answer Knowledge Question */

function answerKnowledgeQuestion(selected, clickedButton) {

  const question =
    knowledgeQuestions[knowledgeIndex];

  const buttons =
    document.querySelectorAll(
      "#knowledgeAnswers button"
    );

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  if (selected === question.correct) {

    knowledgeScore++;

    clickedButton.classList.add("correct");

  } else {

    clickedButton.classList.add("wrong");

    buttons[question.correct]
      .classList.add("correct");

  }

  setTimeout(function() {

    knowledgeIndex++;

    if (
      knowledgeIndex <
      knowledgeQuestions.length
    ) {

      showKnowledgeQuestion();

    } else {

      showKnowledgeResult();

    }

  }, 700);
}


/* Knowledge Result */

function showKnowledgeResult() {

  hideAll();

  document
    .getElementById("knowledgeResult")
    .classList.remove("hidden");

  document.getElementById("knowledgeScore").textContent =
    knowledgeScore +
    " / " +
    knowledgeQuestions.length;

  let message;

  if (knowledgeScore === 20) {

    message =
      "ABSOLUTE NINJAGO MASTER! 🥷🔥 You got every question right!";

  } else if (knowledgeScore >= 17) {

    message =
      "Legendary! You seriously know your Ninjago lore.";

  } else if (knowledgeScore >= 14) {

    message =
      "Amazing! You're a true Ninjago fan.";

  } else if (knowledgeScore >= 10) {

    message =
      "Pretty good! But there is still more lore to discover.";

  } else {

    message =
      "Keep training, ninja! The hard quiz is not messing around.";

  }

  document.getElementById("knowledgeMessage").textContent =
    message;
}


/* =========================================================
   QUIZ 2 — WHICH CHARACTER ARE YOU?
========================================================= */

const personalityQuestions = [

  {
    question: "A huge enemy appears. What do you do first?",
    answers: [
      ["Arin", "Arin"],
      ["Lloyd", "Lloyd"],
      ["Wyldfyre", "Wyldfyre"],
      ["Cole", "Cole"]
    ]
  },

  {
    question: "Which quality describes you best?",
    answers: [
      ["Creative", "Sora"],
      ["Fearless", "Wyldfyre"],
      ["Calm", "Zane"],
      ["Loyal", "Cole"]
    ]
  },

  {
    question: "Pick a way to solve a difficult problem.",
    answers: [
      ["Build something", "Sora"],
      ["Try again until I succeed", "Arin"],
      ["Think carefully first", "Zane"],
      ["Trust my instincts", "Kai"]
    ]
  },

  {
    question: "What would you do if your friend was in danger?",
    answers: [
      ["Jump in immediately", "Kai"],
      ["Make a smart plan", "Lloyd"],
      ["Protect them no matter what", "Nya"],
      ["Charge in without thinking", "Wyldfyre"]
    ]
  },

  {
    question: "Which environment sounds best?",
    answers: [
      ["A futuristic city", "Sora"],
      ["A huge mountain", "Cole"],
      ["A wild jungle", "Wyldfyre"],
      ["A peaceful monastery", "Lloyd"]
    ]
  },

  {
    question: "Which sounds most like you?",
    answers: [
      ["I ask lots of questions", "Arin"],
      ["I think before I speak", "Zane"],
      ["I love making people laugh", "Jay"],
      ["I take charge", "Kai"]
    ]
  },

  {
    question: "What matters most in a team?",
    answers: [
      ["Trust", "Lloyd"],
      ["Bravery", "Wyldfyre"],
      ["Good ideas", "Sora"],
      ["Strength", "Cole"]
    ]
  },

  {
    question: "Pick a superpower.",
    answers: [
      ["Lightning", "Jay"],
      ["Water", "Nya"],
      ["Energy", "Lloyd"],
      ["Fire", "Kai"]
    ]
  },

  {
    question: "What would you do after winning a battle?",
    answers: [
      ["Celebrate!", "Jay"],
      ["Check that everyone is okay", "Nya"],
      ["Train for the next one", "Kai"],
      ["Study what happened", "Zane"]
    ]
  },

  {
    question: "Which word sounds most like your personality?",
    answers: [
      ["Curious", "Arin"],
      ["Inventive", "Sora"],
      ["Wild", "Wyldfyre"],
      ["Wise", "Euphrasia"]
    ]
  },

  {
    question: "What would you rather have?",
    answers: [
      ["A dragon companion", "Riyu"],
      ["A powerful weapon", "Frak"],
      ["A brilliant invention", "Sora"],
      ["A legendary destiny", "Lloyd"]
    ]
  },

  {
    question: "Someone challenges you to a fight. You...",
    answers: [
      ["Accept immediately", "Frak"],
      ["Try to avoid unnecessary fighting", "Euphrasia"],
      ["Make a joke", "Jay"],
      ["Get ready to defend your friends", "Nya"]
    ]
  },

  {
    question: "Which trait would you most want to improve?",
    answers: [
      ["Confidence", "Arin"],
      ["Patience", "Wyldfyre"],
      ["Leadership", "Lloyd"],
      ["Relaxing", "Kai"]
    ]
  },

  {
    question: "Pick a teammate.",
    answers: [
      ["Someone clever", "Sora"],
      ["Someone fearless", "Frak"],
      ["Someone dependable", "Cole"],
      ["Someone hilarious", "Jay"]
    ]
  },

  {
    question: "What kind of friend are you?",
    answers: [
      ["The protector", "Nya"],
      ["The problem solver", "Zane"],
      ["The energetic one", "Arin"],
      ["The adventurous one", "Wyldfyre"]
    ]
  },

  {
    question: "Which sounds like the best adventure?",
    answers: [
      ["Exploring the skies", "Euphrasia"],
      ["Discovering a new world", "Riyu"],
      ["Building something amazing", "Sora"],
      ["Fighting a powerful villain", "Kai"]
    ]
  },

  {
    question: "When things go wrong, what do you do?",
    answers: [
      ["Stay calm", "Zane"],
      ["Keep everyone together", "Lloyd"],
      ["Try something completely different", "Sora"],
      ["Keep going no matter what", "Cole"]
    ]
  },

  {
    question: "Which would you rather be known for?",
    answers: [
      ["Being brave", "Frak"],
      ["Being wise", "Euphrasia"],
      ["Being loyal", "Cole"],
      ["Being powerful", "Wyldfyre"]
    ]
  },

  {
    question: "What makes you happiest?",
    answers: [
      ["Making people laugh", "Jay"],
      ["Helping people", "Nya"],
      ["Learning something new", "Zane"],
      ["Going on adventures", "Riyu"]
    ]
  },

  {
    question: "Choose your final ninja-style trait.",
    answers: [
      ["Never give up", "Arin"],
      ["Always protect others", "Lloyd"],
      ["Always be yourself", "Wyldfyre"],
      ["Always stand with your friends", "Kai"]
    ]
  }

];


/*
Each answer gives one point to the selected character.
All 12 characters are possible results.
*/

let personalityIndex = 0;

let personalityScores = {

  Arin: 0,
  Sora: 0,
  Wyldfyre: 0,
  Euphrasia: 0,
  Frak: 0,
  Riyu: 0,
  Lloyd: 0,
  Nya: 0,
  Cole: 0,
  Jay: 0,
  Zane: 0,
  Kai: 0

};


/* Start Personality Quiz */

function startPersonalityQuiz() {

  hideAll();

  document
    .getElementById("personalityQuiz")
    .classList.remove("hidden");

  personalityIndex = 0;

  personalityScores = {

    Arin: 0,
    Sora: 0,
    Wyldfyre: 0,
    Euphrasia: 0,
    Frak: 0,
    Riyu: 0,
    Lloyd: 0,
    Nya: 0,
    Cole: 0,
    Jay: 0,
    Zane: 0,
    Kai: 0

  };

  showPersonalityQuestion();
}


/* Show Personality Question */

function showPersonalityQuestion() {

  const question =
    personalityQuestions[personalityIndex];

  document.getElementById(
    "personalityProgress"
  ).textContent =
    "Question " +
    (personalityIndex + 1) +
    " of " +
    personalityQuestions.length;

  document.getElementById(
    "personalityQuestion"
  ).textContent =
    question.question;

  const answers =
    document.getElementById(
      "personalityAnswers"
    );

  answers.innerHTML = "";

  question.answers.forEach(function(answer, index) {

    const button =
      document.createElement("button");

    button.className = "answer-button";

    button.textContent =
      String.fromCharCode(65 + index) +
      ". " +
      answer[0];

    button.onclick = function() {

      answerPersonalityQuestion(
        answer[1],
        button
      );

    };

    answers.appendChild(button);

  });
}


/* Answer Personality Question */

function answerPersonalityQuestion(
  character,
  clickedButton
) {

  const buttons =
    document.querySelectorAll(
      "#personalityAnswers button"
    );

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  personalityScores[character]++;

  clickedButton.classList.add("correct");

  setTimeout(function() {

    personalityIndex++;

    if (
      personalityIndex <
      personalityQuestions.length
    ) {

      showPersonalityQuestion();

    } else {

      showPersonalityResult();

    }

  }, 400);
}


/* Personality Result */

function showPersonalityResult() {

  hideAll();

  document
    .getElementById("personalityResult")
    .classList.remove("hidden");

  let winner = "Arin";

  let highestScore = -1;

  for (
    const character in personalityScores
  ) {

    if (
      personalityScores[character] >
      highestScore
    ) {

      highestScore =
        personalityScores[character];

      winner = character;

    }

  }

  const descriptions = {

    Arin:
      "You are Arin! You are determined, energetic, curious and never afraid to keep trying.",

    Sora:
      "You are Sora! You are creative, intelligent and brilliant at finding new ways to solve problems.",

    Wyldfyre:
      "You are Wyldfyre! You are fearless, wild, energetic and completely yourself.",

    Euphrasia:
      "You are Euphrasia! You are thoughtful, independent and wise, with a strong sense of what is right.",

    Frak:
      "You are Frak! You are tough, brave and ready to stand up for yourself and your friends.",

    Riyu:
      "You are Riyu! You are adventurous, loyal, energetic and always ready to help your friends.",

    Lloyd:
      "You are Lloyd! You are a natural leader who cares deeply about your friends and is willing to carry great responsibility.",

    Nya:
      "You are Nya! You are determined, intelligent, protective and never afraid to prove yourself.",

    Cole:
      "You are Cole! You are strong, dependable, loyal and always there when your team needs you.",

    Jay:
      "You are Jay! You are funny, energetic, creative and always capable of bringing some personality to the team.",

    Zane:
      "You are Zane! You are calm, intelligent, thoughtful and incredibly loyal to the people you care about.",

    Kai:
      "You are Kai! You are passionate, courageous, competitive and fiercely protective of your friends."
  };

  document.getElementById(
    "characterResult"
  ).textContent =
    "You are " + winner + "!";

  document.getElementById(
    "characterDescription"
  ).textContent =
    descriptions[winner];
}


/* =========================================================
   NAVIGATION
========================================================= */

function hideAll() {

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("knowledgeQuiz")
    .classList.add("hidden");

  document
    .getElementById("knowledgeResult")
    .classList.add("hidden");

  document
    .getElementById("personalityQuiz")
    .classList.add("hidden");

  document
    .getElementById("personalityResult")
    .classList.add("hidden");
}


function goHome() {

  hideAll();

  document
    .getElementById("home")
    .classList.remove("hidden");
}

</script>

</body>
</html>
