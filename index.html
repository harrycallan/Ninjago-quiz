/* =========================================
   SHUFFLE
========================================= */


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;
}



/* =========================================

function showQuestion() {

    const q =
        questions[currentQuestion];


    document.getElementById(
        "progress"
    ).textContent =

        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById(
        "difficulty"
    ).textContent =

        q.difficulty;


    questionBox.textContent =
        q.question;


    answersBox.innerHTML = "";


    nextButton.style.display =
        "none";


    const answers =
        shuffle(
            [...q.answers]
        );


    answers.forEach(
        function(answer) {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                answer;


            button.onclick =
                function() {


                    checkAnswer(
                        button,
                        answer,
                        q.correct
                    );


                };


            answersBox.appendChild(
                button
            );


        }
    );

}



/* =========================================
   CHECK ANSWER
========================================= */


function checkAnswer(
    button,
    selected,
    correct
) {


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        function(b) {


            b.disabled =
                true;


            if (
                b.textContent ===
                correct
            ) {

                b.classList.add(
                    "correct"
                );

            }


        }
    );


    if (
        selected ===
        correct
    ) {


        score++;


        button.classList.add(
            "correct"
        );


    } else {


        button.classList.add(
            "wrong"
        );


    }


    nextButton.style.display =
        "block";

}

  ninjaQuestionNumber = 0;

  } else {
    showNinjaResult();
