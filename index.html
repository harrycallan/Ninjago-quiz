<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>Ninjago Master Quiz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111111, #252525);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.quiz {
    width: 100%;
    max-width: 700px;
    background: #1d1d1d;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

h1 {
    text-align: center;
    margin-top: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #bbbbbb;
    margin-bottom: 25px;
}

.top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: bold;
}

#difficulty {
    color: #ffcc00;
}

#question {
    font-size: 24px;
    line-height: 1.4;
    margin: 25px 0;
    text-align: center;
}

.answer {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: 2px solid #444;
    border-radius: 12px;
    background: #303030;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #454545;
}

.answer:disabled {
    cursor: default;
}

.correct {
    background: #16803c !important;
    border-color: #35d878 !important;
}

.wrong {
    background: #a52a2a !important;
    border-color: #ff6666 !important;
}

.actionButton {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #ffcc00;
    color: #111;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.actionButton:hover {
    background: #ffe066;
}

#nextButton {
    display: none;
}

#resultScreen,
#ninjaQuizScreen,
#ninjaResultScreen {
    display: none;
}

#finalScore {
    font-size: 42px;
    text-align: center;
    color: #ffcc00;
    margin: 20px 0;
}

#rank,
#ninjaResult {
    text-align: center;
    font-size: 21px;
    line-height: 1.5;
}

.secondaryButton {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: 2px solid #ffcc00;
    border-radius: 12px;
    background: transparent;
    color: #ffcc00;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.secondaryButton:hover {
    background: #333;
}
</style>
</head>

<body>

<div class="quiz">

<!-- ========================= -->
<!-- MAIN QUIZ -->
<!-- ========================= -->

<div id="mainQuiz">

<h1>🥷 NINJAGO QUIZ 🥷</h1>

<div class="subtitle">
How well do you know Ninjago?
</div>

<div class="top">
    <span id="progress"></span>
    <span id="difficulty"></span>
</div>

<div id="question"></div>

<div id="answers"></div>

<button
    id="nextButton"
    class="actionButton">
    Next Question →
</button>

</div>


<!-- ========================= -->
<!-- MAIN QUIZ RESULTS -->
<!-- ========================= -->

<div id="resultScreen">

<h1>🏆 QUIZ COMPLETE 🏆</h1>

<div id="finalScore"></div>

<div id="rank"></div>

<button
    id="restartButton"
    class="actionButton">
    🔄 Play Again
</button>

<button
    id="goNinjaButton"
    class="secondaryButton">
    🥷 Which Ninja Are You?
</button>

</div>


<!-- ========================= -->
<!-- WHICH NINJA ARE YOU -->
<!-- ========================= -->

<div id="ninjaQuizScreen">

<h1>🥷 WHICH NINJA ARE YOU?</h1>

<div class="subtitle">
Choose the answer that sounds most like you.
</div>

<div class="top">
    <span id="ninjaProgress"></span>
</div>

<div id="ninjaQuestion"></div>

<div id="ninjaAnswers"></div>

<button
    id="ninjaNextButton"
    class="actionButton"
    style="display:none;">
    Next Question →
</button>

</div>


<!-- ========================= -->
<!-- NINJA RESULTS -->
<!-- ========================= -->

<div id="ninjaResultScreen">

<h1>🥷 YOUR NINJA IS...</h1>

<div id="ninjaResult"></div>

<button
    id="ninjaAgainButton"
    class="actionButton">
    🔄 Try Again
</button>

<button
    id="backToMainButton"
    class="secondaryButton">
    🏆 Back To Main Quiz
</button>

</div>


<script>

/* =====================================

===================================== */

const questions = [

{

correct: "Fire",

{

correct: "Lightning",
difficulty: "EASY"
},

{

correct: "Earth",
difficulty: "EASY"
},

{
question: "What element does Zane control?",
answers: ["Ice", "Lightning", "Fire", "Energy"],
correct: "Ice",
difficulty: "EASY"
},

{
question: "What element does Nya control?",
answers: ["Water", "Wind", "Earth", "Fire"],
correct: "Water",
difficulty: "EASY"
},

{
question: "What is Lloyd's elemental power?",
answers: ["Energy", "Fire", "Earth", "Lightning"],
correct: "Energy",
difficulty: "EASY"
},

{
question: "Who is Lloyd's mother?",
answers: ["Misako", "Maya", "Lilly", "Faith"],
correct: "Misako",
difficulty: "EASY"
},

{
question: "What is Cole's mother's name?",
answers: ["Lilly", "Misako", "Maya", "Sally"],
correct: "Lilly",
difficulty: "MEDIUM"
},

{
question: "Who is the last of the Anacondrai?",

{

{

{

},

"Scythe of Quakes",

],

},

{

},

{

},

},

{
question: "Which elemental master controls Metal?",
answers: ["Karlof", "Ash", "Bolobo", "Shade"],

},

{
question: "Which elemental master controls Shadow?",
answers: ["Shade", "Ash", "Bolobo", "Jacob"],
correct: "Shade",
difficulty: "VERY HARD"
},

{
question: "Which Serpentine tribe specializes in hypnosis?",
answers: ["Hypnobrai", "Venomari", "Fangpyre", "Constrictai"],
correct: "Hypnobrai",
difficulty: "VERY HARD"
},

{
question: "Which Serpentine tribe specializes in poison?",
answers: ["Venomari", "Hypnobrai", "Fangpyre", "Constrictai"],
correct: "Venomari",
difficulty: "VERY HARD"
},

{
question: "Which Serpentine tribe was known for enormous strength?",
answers: ["Constrictai", "Hypnobrai", "Venomari", "Fangpyre"],
correct: "Constrictai",
difficulty: "VERY HARD"
},

{
question: "Who created the Nindroids?",
answers: ["Dr. Cyrus Borg", "Dr. Julien", "Master Chen", "The Overlord"],
correct: "Dr. Cyrus Borg",
difficulty: "EXPERT"
},

{
question: "Who was the leader of the Time Twins?",
answers: ["Krux", "Acronix", "Chen", "Clouse"],
correct: "Krux",
difficulty: "EXPERT"
},

{
question: "What are the four Time Blades?",
answers: [
"Forward, Reverse, Pause, Slow-Mo",
"Past, Present, Future, Eternity",
"Speed, Stop, Reverse, Advance",
"Time, Space, Age, Future"
],
correct: "Forward, Reverse, Pause, Slow-Mo",
difficulty: "EXPERT"
},

{
question: "What was the name of Chen's island?",
answers: ["Chen's Island", "Stiix", "Dark Island", "Djinjago"],
correct: "Chen's Island",
difficulty: "EXPERT"
},

{
question: "What were the names of the First Spinjitzu Master's two sons?",
answers: [
"Wu and Garmadon",
"Lloyd and Garmadon",
"Wu and Morro",
"Garmadon and Chen"
],
correct: "Wu and Garmadon",
difficulty: "FINAL BOSS"
},

{
question: "Who is known as the Master of Ice?",
answers: ["Zane", "Kai", "Cole", "Jay"],
correct: "Zane",
difficulty: "FINAL BOSS"
}

];


/* =====================================
   MAIN QUIZ VARIABLES
===================================== */

let currentQuestion = 0;
let score = 0;

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const nextButton =
document.getElementById("nextButton");

const progressElement =
document.getElementById("progress");

const difficultyElement =
document.getElementById("difficulty");


/* =====================================
   MAIN QUIZ
===================================== */

function showQuestion() {

const q = questions[currentQuestion];

progressElement.textContent =
"Question " +
(currentQuestion + 1) +
" / " +
questions.length;

difficultyElement.textContent =
q.difficulty;

questionElement.textContent =
q.question;

answersElement.innerHTML = "";

nextButton.style.display = "none";


q.answers.forEach(function(answer) {

const button =
document.createElement("button");

button.className = "answer";

button.textContent = answer;

button.onclick = function() {

selectAnswer(button, answer, q.correct);

};

answersElement.appendChild(button);

});

}


function selectAnswer(
button,
selected,
correct
) {

const buttons =
document.querySelectorAll("#answers .answer");

buttons.forEach(function(btn) {

btn.disabled = true;

if (btn.textContent === correct) {

btn.classList.add("correct");

}

});


if (selected === correct) {

score++;

button.classList.add("correct");

} else {

button.classList.add("wrong");

}

nextButton.style.display = "block";

}


nextButton.onclick = function() {

currentQuestion++;

if (currentQuestion >= questions.length) {

showMainResults();

} else {

showQuestion();

}

};


/* =====================================
   MAIN RESULTS
===================================== */

function showMainResults() {

document.getElementById("mainQuiz")
.style.display = "none";

document.getElementById("resultScreen")
.style.display = "block";

const percentage =
Math.round(
(score / questions.length) * 100
);

document.getElementById("finalScore")
.textContent =
score +
" / " +
questions.length +
" (" +
percentage +
"%)";


let rank;


if (percentage === 100) {

rank =
"👑 FIRST SPINJITZU MASTER LEVEL 👑<br><br>" +
"Perfect score! You are a Ninjago legend.";

}

else if (percentage >= 90) {

rank =
"🐉 LEGENDARY NINJA<br><br>" +
"Your Ninjago knowledge is INSANE.";

}

else if (percentage >= 75) {

rank =
"🥷 MASTER OF SPINJITZU<br><br>" +
"You are a true Ninjago expert.";

}

else if (percentage >= 60) {

rank =
"⚔️ ELITE NINJA<br><br>" +
"Very impressive.";

}

else if (percentage >= 40) {

rank =
"🔥 NINJA IN TRAINING<br><br>" +
"Keep training!";

}

else {

rank =
"🐍 THE SERPENTINE WON<br><br>" +
"Back to the monastery!";

}


document.getElementById("rank")
.innerHTML = rank;

}


/* =====================================
   RESTART MAIN QUIZ
===================================== */

document.getElementById("restartButton")
.onclick = function() {

currentQuestion = 0;
score = 0;

document.getElementById("resultScreen")
.style.display = "none";

document.getElementById("mainQuiz")
.style.display = "block";

showQuestion();

};


/* =====================================
   WHICH NINJA ARE YOU?
===================================== */

const ninjaQuestions = [

{
question: "Your friend is in danger. What do you do?",

answers: [
{
text: "Protect them no matter what",
ninja: "Lloyd"
},
{
text: "Make a clever plan",
ninja: "Sora"
},
{
text: "Charge straight into battle",
ninja: "Kai"
},
{
text: "Stay calm and think",
ninja: "Zane"
}
]
},

{
question: "What sounds like the most fun?",

answers: [
{
text: "Going on an adventure",
ninja: "Lloyd"
},
{
text: "Building something awesome",
ninja: "Sora"
},
{
text: "Training and fighting",
ninja: "Kai"
},
{
text: "Making everyone laugh",
ninja: "Jay"
}
},

{
question: "Which describes your personality best?",

answers: [
{
text: "Brave",
ninja: "Kai"
},
{
text: "Caring",
ninja: "Nya"
},
{
text: "Strong",
ninja: "Cole"
},
{
text: "Smart",
ninja: "Zane"
}
},

{
question: "What would your friends say about you?",

answers: [
{
text: "I am a natural leader",
ninja: "Lloyd"
},
{
text: "I am funny",
ninja: "Jay"
},
{
text: "I am loyal",
ninja: "Cole"
},
{
text: "I am creative",
ninja: "Sora"
}
},

{
question: "Pick a fighting style.",

answers: [
{
text: "Fast and aggressive",
ninja: "Kai"
},
{
text: "Powerful attacks",
ninja: "Cole"
},
{
text: "Quick and clever",
ninja: "Jay"
},
{
text: "Precise and calculated",
ninja: "Zane"
}
},

{
question: "What matters most to you?",

answers: [
{
text: "Protecting people",
ninja: "Lloyd"
},
{
text: "Family",
ninja: "Nya"
},
{
text: "Having fun",
ninja: "Jay"
},
{
text: "Learning new things",
ninja: "Sora"
}
}

];


let ninjaCurrentQuestion = 0;

let ninjaScores = {};


/* =====================================
   START NINJA QUIZ
===================================== */

function startNinjaQuiz() {

ninjaCurrentQuestion = 0;

ninjaScores = {

Lloyd: 0,
Sora: 0,
Kai: 0,
Zane: 0,
Jay: 0,
Nya: 0,
Cole: 0

};

document.getElementById("mainQuiz")
.style.display = "none";

document.getElementById("resultScreen")
.style.display = "none";

document.getElementById("ninjaResultScreen")
.style.display = "none";

document.getElementById("ninjaQuizScreen")
.style.display = "block";

showNinjaQuestion();

}


/* =====================================
   SHOW NINJA QUESTION
===================================== */

function showNinjaQuestion() {

const q =
ninjaQuestions[ninjaCurrentQuestion];

document.getElementById("ninjaProgress")
.textContent =
"Question " +
(ninjaCurrentQuestion + 1) +
" / " +
ninjaQuestions.length;

document.getElementById("ninjaQuestion")
.textContent =
q.question;

const answers =
document.getElementById("ninjaAnswers");

answers.innerHTML = "";


q.answers.forEach(function(answer) {

const button =
document.createElement("button");

button.className = "answer";

button.textContent =
answer.text;

button.onclick = function() {

selectNinjaAnswer(button, answer.ninja);

};

answers.appendChild(button);

});

}


/* =====================================
   SELECT NINJA ANSWER
===================================== */

function selectNinjaAnswer(
button,
ninja
) {

const buttons =
document.querySelectorAll(
"#ninjaAnswers .answer"
);

buttons.forEach(function(btn) {

btn.disabled = true;

});


button.classList.add("correct");

ninjaScores[ninja]++;

document.getElementById("ninjaNextButton")
.style.display = "block";

}


/* =====================================
   NEXT NINJA QUESTION
===================================== */

document.getElementById("ninjaNextButton")
.onclick = function() {

ninjaCurrentQuestion++;

if (
ninjaCurrentQuestion >=
ninjaQuestions.length
) {

showNinjaResult();

} else {

document.getElementById("ninjaNextButton")
.style.display = "none";

showNinjaQuestion();

}

};


/* =====================================
   NINJA RESULT
===================================== */

function showNinjaResult() {

let winner = "Lloyd";

let highest = -1;


for (let ninja in ninjaScores) {

if (ninjaScores[ninja] > highest) {

highest =
ninjaScores[ninja];

winner =
ninja;

}

}


const descriptions = {

Lloyd:
"💚 You are Lloyd!<br><br>" +
"You are brave, caring and a natural leader.",

Sora:
"💜 You are Sora!<br><br>" +
"You are creative, clever and determined.",

Kai:
"❤️ You are Kai!<br><br>" +
"You are brave, passionate and always ready for action.",

Zane:
"🤍 You are Zane!<br><br>" +
"You are intelligent, calm and extremely loyal.",

Jay:
"💙 You are Jay!<br><br>" +
"You are funny, energetic and full of personality.",

Nya:
"💙 You are Nya!<br><br>" +
"You are strong, independent and caring.",

Cole:
"🖤 You are Cole!<br><br>" +
"You are strong, loyal and always there for your friends."

};


document.getElementById("ninjaQuizScreen")
.style.display = "none";

document.getElementById("ninjaResultScreen")
.style.display = "block";

document.getElementById("ninjaResult")
.innerHTML =
descriptions[winner];

}


/* =====================================
   NINJA QUIZ AGAIN
===================================== */

document.getElementById("ninjaAgainButton")
.onclick = function() {

startNinjaQuiz();

};


/* =====================================
   BACK TO MAIN QUIZ
===================================== */

document.getElementById("backToMainButton")
.onclick = function() {

document.getElementById("ninjaResultScreen")
.style.display = "none";

document.getElementById("mainQuiz")
.style.display = "block";

currentQuestion = 0;
score = 0;

showQuestion();

};


/* =====================================
   BUTTON FROM MAIN RESULTS
===================================== */

document.getElementById("goNinjaButton")
.onclick = function() {

startNinjaQuiz();

};


/* =====================================
   START
===================================== */

showQuestion();

</script>

</body>
</html>
