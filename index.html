<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ninjago Master Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111111, #252525);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz {
            width: 100%;
            max-width: 700px;
            background: #1d1d1d;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #bbbbbb;
            margin-bottom: 25px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #difficulty {
            color: #ffcc00;
        }

        #question {
            font-size: 24px;
            line-height: 1.4;
            margin: 25px 0;
            text-align: center;
        }

        .answer {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: 2px solid #444;
            border-radius: 12px;
            background: #303030;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            background: #454545;
            transform: scale(1.01);
        }

        .answer:disabled {
            cursor: default;
        }

        .correct {
            background: #16803c !important;
            border-color: #35d878 !important;
        }

        .wrong {
            background: #a52a2a !important;
            border-color: #ff6666 !important;
        }

        #next {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ffcc00;
            color: #111;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        #next:hover {
            background: #ffe066;
        }

        #result {
            display: none;
            text-align: center;
        }

        #finalScore {
            font-size: 42px;
            color: #ffcc00;
        }

        #rank {
            font-size: 21px;
            line-height: 1.5;
        }

        #restart {
            margin-top: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: #ffcc00;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="quiz">

    <div id="game">

        <h1>🥷 NINJAGO QUIZ 🥷</h1>

        <div class="subtitle">
            The questions get harder as you progress.
        </div>

        <div class="top">
            <span id="progress"></span>
            <span id="difficulty"></span>
        </div>

        <div id="question"></div>

        <div id="answers"></div>

        <button id="next">
            Next Question →
        </button>

    </div>


    <div id="result">

        <h1>🏆 QUIZ COMPLETE 🏆</h1>

        <div id="finalScore"></div>

        <p id="rank"></p>

        <button id="restart">
            🥷 Play Again
        </button>

    </div>

</div>


<script>

const questions = [

    // =========================
    // HARD
    // =========================

    {

        question: "What element does Kai control?",
        answers: ["Fire", "Lightning", "Earth", "Ice"],

    },

    {
        difficulty: "HARD",

    {

        answers: ["Pythor", "Skales", "Fangtom", "Skalidor"],
        correct: "Pythor"
    },

    {

    },

    {

    },


    // =========================
    // VERY HARD
    // =========================

    {

    },

    {
        difficulty: "VERY HARD",
        question: "Which Golden Weapon is associated with Earth?",
        answers: [
            "Scythe of Quakes",
            "Sword of Fire",
            "Nunchucks of Lightning",
            "Shurikens of Ice"
        ],
        correct: "Scythe of Quakes"
    },

    {
        difficulty: "VERY HARD",
        question: "Who was the leader of the Stone Army?",
        answers: [
            "General Kozu",
            "General Cryptor",
            "General Vex",
            "General Machia"
        ],
        correct: "General Kozu"
    },

    {
        difficulty: "VERY HARD",
        question: "What was Morro's elemental power?",
        answers: ["Wind", "Ghost", "Air", "Spirit"],
        correct: "Wind"
    },

    {
        difficulty: "VERY HARD",
        question: "What was the name of the realm ruled by the Overlord?",
        answers: [
            "Dark Island",
            "Cursed Realm",
            "Djinjago",
            "Cloud Kingdom"
        ],
        correct: "Dark Island"
    },


    // =========================
    // EXPERT
    // =========================

    {
        difficulty: "EXPERT",
        question: "Who was the original Master of Ice before Zane?",
        answers: [
            "Dr. Julien",
            "Dr. Borg",
            "Griffin Turner",
            "Mikhail"
        ],
        correct: "Dr. Julien"
    },

    {
        difficulty: "EXPERT",
        question: "Which elemental master controls Smoke?",
        answers: [
            "Ash",
            "Shade",
            "Bolobo",
            "Griffin Turner"
        ],
        correct: "Ash"
    },

    {
        difficulty: "EXPERT",
        question: "What is Skylor's elemental power?",
        answers: [
            "Amber",
            "Energy",
            "Absorption",
            "Copy"
        ],
        correct: "Amber"
    },

    {
        difficulty: "EXPERT",
        question: "Who was the leader of the Time Twins?",
        answers: [
            "Krux",
            "Acronix",
            "Chen",
            "Clouse"
        ],
        correct: "Krux"
    },

    {

        question: "Which ninja became a ghost during the events involving Morro?",
        answers: ["Cole", "Jay", "Kai", "Lloyd"],
        correct: "Cole"
    },


    // =========================
    // INSANE
    // =========================

    {
        difficulty: "INSANE",
        question: "What are the names of the four Time Blades?",
        answers: [
            "Forward, Reverse, Pause, Slow-Mo",
            "Past, Present, Future, Eternity",
            "Speed, Stop, Reverse, Advance",
            "Time, Space, Age, Future"
        ],
        correct: "Forward, Reverse, Pause, Slow-Mo"
    },

    {

        question: "What was the name of the island where Master Chen held his tournament?",
        answers: [
            "Chen's Island",
            "Stiix",
            "Dark Island",
            "Djinjago"
        ],
        correct: "Chen's Island"
    },

    {

    },

    {

        answers: ["Pythor", "Garmadon", "Skales", "Chen"],

    },


    // =========================
    // 5,000-HOUR FAN
    // =========================

    {

        question: "Which elemental master possesses the power of Nature?",
        answers: ["Bolobo", "Griffin Turner", "Shade", "Jacob"],
        correct: "Bolobo"
    },

    {
        difficulty: "5,000-HOUR FAN",

        answers: ["Griffin Turner", "Karlof", "Shade", "Tox"],
        correct: "Griffin Turner"
    },

    {
        difficulty: "5,000-HOUR FAN",
        question: "Which elemental master possesses the power of Metal?",
        answers: ["Karlof", "Griffin Turner", "Bolobo", "Ash"],
        correct: "Karlof"
    },

    {
        difficulty: "5,000-HOUR FAN",
        question: "Which elemental master possesses the power of Shadow?",
        answers: ["Shade", "Ash", "Bolobo", "Jacob"],
        correct: "Shade"
    },


    // =========================
    // ABSURD
    // =========================

    {
        difficulty: "ABSURD",
        question: "Which Serpentine tribe specializes in hypnosis?",
        answers: [
            "Hypnobrai",
            "Venomari",
            "Fangpyre",
            "Constrictai"
        ],
        correct: "Hypnobrai"
    },

    {
        difficulty: "ABSURD",
        question: "Which Serpentine tribe specializes in poison?",
        answers: [
            "Venomari",
            "Hypnobrai",
            "Fangpyre",
            "Constrictai"
        ],
        correct: "Venomari"
    },

    {
        difficulty: "ABSURD",
        question: "Which Serpentine tribe was known for enormous strength?",
        answers: [
            "Constrictai",
            "Hypnobrai",
            "Venomari",
            "Fangpyre"
        ],
        correct: "Constrictai"

    // =========================
    // FINAL BOSS
    // =========================

    {
        difficulty: "FINAL BOSS",
        question: "Who was the first student trained by Master Wu?",
        answers: [
            "Morro",
            "Garmadon",
            "Lloyd",
            "Cole"
        ],
        correct: "Morro"
    },

    {
        difficulty: "FINAL BOSS",
        question: "Who was responsible for creating the Nindroids?",
        answers: [
            "Dr. Cyrus Borg",
            "Dr. Julien",
            "Master Chen",
            "The Overlord"
        ],
        correct: "Dr. Cyrus Borg"
    },

    {
        difficulty: "FINAL BOSS",
        question: "What was the name of Garmadon's giant mech?",
        answers: [
            "Garmatron",
            "Garmadon's Colossus",
            "Destruction",
            "Mega Garmadon"
        ],
        correct: "Garmatron"
    },

    {
        difficulty: "FINAL BOSS",
        question: "What were the names of the First Spinjitzu Master's two sons?",
        answers: [
            "Wu and Garmadon",
            "Lloyd and Garmadon",
            "Wu and Morro",
            "Garmadon and Chen"
        ],
        correct: "Wu and Garmadon"
    }

];


let currentQuestion = 0;
let score = 0;


const questionBox =
    document.getElementById("question");

const answersBox =
    document.getElementById("answers");

const nextButton =
    document.getElementById("next");


function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];

    }

    return array;
}


function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    document.getElementById("difficulty").textContent =
        q.difficulty;

    questionBox.textContent =
        q.question;

    answersBox.innerHTML = "";

    nextButton.style.display = "none";

    const answers = shuffle([...q.answers]);

    answers.forEach(function(answer) {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {

            checkAnswer(button, answer, q.correct);

        };

        answersBox.appendChild(button);

    });

}


function checkAnswer(button, selected, correct) {

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(function(b) {

        b.disabled = true;

        if (b.textContent === correct) {

            b.classList.add("correct");

        }

    });


    if (selected === correct) {

        score++;

        button.classList.add("correct");

    } else {

        button.classList.add("wrong");

    }

    nextButton.style.display = "block";
}


nextButton.onclick = function() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResults();

    } else {

        showQuestion();

    }

};


function showResults() {

    document.getElementById("game").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    const percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("finalScore").textContent =
        score + " / " +
        questions.length +
        " (" + percentage + "%)";


    let rank = "";

    if (score === questions.length) {

        rank =
            "👑 FIRST SPINJITZU MASTER LEVEL 👑<br><br>" +
            "Perfect score. Absolutely legendary.";

    } else if (score >= 27) {

        rank =
            "🐉 LEGENDARY NINJA<br><br>" +
            "Your Ninjago knowledge is insane.";

    } else if (score >= 23) {

        rank =
            "🥷 MASTER OF SPINJITZU<br><br>" +
            "You are a true Ninjago expert.";

    } else if (score >= 18) {

        rank =
            "⚔️ ELITE NINJA<br><br>" +
            "You survived the hardest questions.";

    } else if (score >= 13) {

        rank =
            "🔥 EXPERIENCED NINJA<br><br>" +
            "Very impressive.";

    } else if (score >= 8) {

        rank =
            "🐲 NINJA IN TRAINING<br><br>" +
            "Keep training!";

    } else {

        rank =
            "🐍 THE SERPENTINE WON<br><br>" +
            "Back to the monastery!";
    }

    document.getElementById("rank").innerHTML =
        rank;
}


document.getElementById("restart").onclick =
function() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("result").style.display =
        "none";

    document.getElementById("game").style.display =
        "block";

    showQuestion();

};


showQuestion();

</script>

</body>
</html>
