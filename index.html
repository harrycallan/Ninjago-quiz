<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninjago Master Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111111, #252525);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 650px;
}

.card {
  background: #1d1d1d;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.45);
  text-align: center;
}

h1 {
  font-size: 34px;
  margin-top: 0;
}

h2 {
  font-size: 25px;
}

p {
  font-size: 18px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  background: #333333;
  color: white;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #444444;
  transform: scale(1.01);
}

button:active {
  transform: scale(0.98);
}

.start-button {
  background: #e63946;
  font-weight: bold;
}

.start-button:hover {
  background: #ff4d5a;
}

.answer-button {
  text-align: left;
}

.correct {
  background: #16803c !important;
}

.wrong {
  background: #a51d2d !important;
}

.hidden {
  display: none;
}

.score {
  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;
}

.progress {
  color: #aaaaaa;
  margin-bottom: 20px;
}

.result {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0;
}
</style>
</head>

<body>

<div class="container">

  <!-- HOME -->
  <div id="home" class="card">
    <h1>🥷 NINJAGO QUIZ 🥷</h1>
    <p>How well do you know Ninjago?</p>

    <button class="start-button" onclick="startQuiz1()">
      Start Ninjago Knowledge Quiz
    </button>

    <button class="start-button" onclick="startQuiz2()">
      Start Ninja Personality Quiz
    </button>
  </div>


  <!-- QUIZ 1 -->
  <div id="quiz1" class="card hidden">
    <div class="progress" id="quiz1Progress"></div>

    <h2 id="quiz1Question"></h2>

    <div id="quiz1Answers"></div>
  </div>


  <!-- QUIZ 1 RESULT -->
  <div id="quiz1Result" class="card hidden">
    <h1>🥷 Quiz Complete!</h1>

    <div class="score" id="quiz1Score"></div>

    <p id="quiz1Message"></p>

    <button class="start-button" onclick="startQuiz2()">
      Take the Ninja Personality Quiz
    </button>

    <button onclick="goHome()">
      Back to Home
    </button>
  </div>


  <!-- QUIZ 2 -->
  <div id="quiz2" class="card hidden">
    <div class="progress" id="quiz2Progress"></div>

    <h2 id="quiz2Question"></h2>

    <div id="quiz2Answers"></div>
  </div>


  <!-- QUIZ 2 RESULT -->
  <div id="quiz2Result" class="card hidden">
    <h1>🥷 Your Ninja Result 🥷</h1>

    <div class="result" id="ninjaResult"></div>

    <p id="ninjaDescription"></p>

    <button class="start-button" onclick="startQuiz1()">
      Play Knowledge Quiz Again
    </button>

    <button onclick="goHome()">
      Back to Home
    </button>
  </div>

</div>


<script>

/* =========================================================
   QUIZ 1 — NINJAGO KNOWLEDGE
========================================================= */

const quiz1Questions = [

  {
    question: "Who is the Green Ninja?",
    answers: ["Kai", "Lloyd", "Jay", "Cole"],
    correct: 1
  },

  {
    question: "Which ninja is associated with fire?",
    answers: ["Kai", "Zane", "Cole", "Jay"],
    correct: 0
  },

  {
    question: "Which ninja is associated with lightning?",
    answers: ["Cole", "Jay", "Kai", "Zane"],
    correct: 1
  },

  {
    question: "Which ninja is associated with ice?",
    answers: ["Zane", "Lloyd", "Kai", "Cole"],
    correct: 0
  },

  {
    question: "Which ninja is associated with earth?",
    answers: ["Jay", "Cole", "Zane", "Kai"],
    correct: 1
  },

  {
    question: "Who is the leader of the ninja team?",
    answers: ["Kai", "Lloyd", "Jay", "Cole"],
    correct: 1
  },

  {
    question: "What is the name of the ninja's flying ship?",
    answers: ["Destiny's Bounty", "Lightning Raider", "Bounty Hunter", "Ninja Flyer"],
    correct: 0
  },

  {
    question: "What is Lloyd's main element?",
    answers: ["Fire", "Energy", "Ice", "Earth"],
    correct: 1
  },

  {
    question: "Who is the blue ninja?",
    answers: ["Jay", "Kai", "Cole", "Zane"],
    correct: 0
  },

  {
    question: "Who is the black ninja?",
    answers: ["Cole", "Jay", "Kai", "Lloyd"],
    correct: 0
  }

];

let quiz1Current = 0;
let quiz1Score = 0;


/* Start Quiz 1 */

function startQuiz1() {

  hideAll();

  document.getElementById("quiz1").classList.remove("hidden");

  quiz1Current = 0;
  quiz1Score = 0;

  showQuiz1Question();
}


/* Show Quiz 1 Question */

function showQuiz1Question() {

  const question = quiz1Questions[quiz1Current];

  document.getElementById("quiz1Progress").textContent =
    "Question " + (quiz1Current + 1) +
    " of " + quiz1Questions.length;

  document.getElementById("quiz1Question").textContent =
    question.question;

  const answersDiv =
    document.getElementById("quiz1Answers");

  answersDiv.innerHTML = "";

  question.answers.forEach(function(answer, index) {

    const button = document.createElement("button");

    button.className = "answer-button";

    button.textContent =
      String.fromCharCode(65 + index) + ". " + answer;

    button.onclick = function() {
      answerQuiz1(index, button);
    };

    answersDiv.appendChild(button);

  });
}


/* Answer Quiz 1 */

function answerQuiz1(selected, clickedButton) {

  const question = quiz1Questions[quiz1Current];

  const buttons =
    document.querySelectorAll("#quiz1Answers button");

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  if (selected === question.correct) {

    quiz1Score++;

    clickedButton.classList.add("correct");

  } else {

    clickedButton.classList.add("wrong");

    buttons[question.correct].classList.add("correct");

  }

  setTimeout(function() {

    quiz1Current++;

    if (quiz1Current < quiz1Questions.length) {

      showQuiz1Question();

    } else {

      showQuiz1Result();

    }

  }, 700);
}


/* Quiz 1 Result */

function showQuiz1Result() {

  hideAll();

  document.getElementById("quiz1Result").classList.remove("hidden");

  document.getElementById("quiz1Score").textContent =
    quiz1Score + " / " + quiz1Questions.length;

  let message;

  if (quiz1Score === quiz1Questions.length) {

    message = "Master level! You really know your Ninjago! 🥷";

  } else if (quiz1Score >= 7) {

    message = "Amazing! You know Ninjago really well!";

  } else if (quiz1Score >= 5) {

    message = "Pretty good! You know your ninja stuff.";

  } else {

    message = "Keep training, ninja! You can do better next time.";

  }

  document.getElementById("quiz1Message").textContent =
    message;
}


/* =========================================================
   QUIZ 2 — NINJA PERSONALITY
========================================================= */

const quiz2Questions = [

  {
    question: "A villain attacks! What do you do?",
    answers: [
      "Charge straight into battle!",
      "Make a clever plan first.",
      "Protect everyone around me.",
      "Use a funny distraction!"
    ],
    scores: {
      0: "Kai",
      1: "Zane",
      2: "Cole",
      3: "Jay"
    }
  },

  {
    question: "Which power would you choose?",
    answers: [
      "Fire",
      "Ice",
      "Earth",
      "Lightning"
    ],
    scores: {
      0: "Kai",
      1: "Zane",
      2: "Cole",
      3: "Jay"
    }
  },

  {
    question: "What describes you best?",
    answers: [
      "Brave and energetic",
      "Calm and intelligent",
      "Strong and dependable",
      "Funny and energetic"
    ],
    scores: {
      0: "Kai",
      1: "Zane",
      2: "Cole",
      3: "Jay"
    }
  },

  {
    question: "Your team needs help. What is your biggest strength?",
    answers: [
      "Courage",
      "Intelligence",
      "Strength",
      "Creativity"
    ],
    scores: {
      0: "Kai",
      1: "Zane",
      2: "Cole",
      3: "Jay"
    }
  },

  {
    question: "Pick a place to train.",
    answers: [
      "A volcano",
      "A snowy mountain",
      "A rocky cave",
      "A high-tech workshop"
    ],
    scores: {
      0: "Kai",
      1: "Zane",
      2: "Cole",
      3: "Jay"
    }
  },

  {
    question: "What matters most to you?",
    answers: [
      "Courage",
      "Knowledge",
      "Loyalty",
      "Having fun"
    ],
    scores: {
      0: "Kai",
      1: "Zane",
      2: "Cole",
      3: "Jay"
    }
  }

];

let quiz2Current = 0;

let ninjaScores = {
  Kai: 0,
  Jay: 0,
  Cole: 0,
  Zane: 0
};


/* Start Quiz 2 */

function startQuiz2() {

  hideAll();

  document.getElementById("quiz2").classList.remove("hidden");

  quiz2Current = 0;

  ninjaScores = {
    Kai: 0,
    Jay: 0,
    Cole: 0,
    Zane: 0
  };

  showQuiz2Question();
}


/* Show Quiz 2 Question */

function showQuiz2Question() {

  const question = quiz2Questions[quiz2Current];

  document.getElementById("quiz2Progress").textContent =
    "Question " + (quiz2Current + 1) +
    " of " + quiz2Questions.length;

  document.getElementById("quiz2Question").textContent =
    question.question;

  const answersDiv =
    document.getElementById("quiz2Answers");

  answersDiv.innerHTML = "";

  question.answers.forEach(function(answer, index) {

    const button = document.createElement("button");

    button.className = "answer-button";

    button.textContent =
      String.fromCharCode(65 + index) + ". " + answer;

    button.onclick = function() {
      answerQuiz2(index, button);
    };

    answersDiv.appendChild(button);

  });
}


/* Answer Quiz 2 */

function answerQuiz2(selected, clickedButton) {

  const question = quiz2Questions[quiz2Current];

  const buttons =
    document.querySelectorAll("#quiz2Answers button");

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  const ninja =
    question.scores[selected];

  ninjaScores[ninja]++;

  clickedButton.classList.add("correct");

  setTimeout(function() {

    quiz2Current++;

    if (quiz2Current < quiz2Questions.length) {

      showQuiz2Question();

    } else {

      showNinjaResult();

    }

  }, 400);
}


/* Ninja Result */

function showNinjaResult() {

  hideAll();

  document.getElementById("quiz2Result").classList.remove("hidden");

  let winner = "Kai";
  let highest = -1;

  for (let ninja in ninjaScores) {

    if (ninjaScores[ninja] > highest) {

      highest = ninjaScores[ninja];

      winner = ninja;

    }

  }

  const descriptions = {

    Kai:
      "You are Kai! 🔥 Brave, determined and always ready for action.",

    Jay:
      "You are Jay! ⚡ Funny, energetic and full of ideas.",

    Cole:
      "You are Cole! 🪨 Strong, loyal and dependable.",

    Zane:
      "You are Zane! ❄️ Calm, intelligent and thoughtful."

  };

  document.getElementById("ninjaResult").textContent =
    "You are " + winner + "!";

  document.getElementById("ninjaDescription").textContent =
    descriptions[winner];
}


/* =========================================================
   NAVIGATION
========================================================= */

function hideAll() {

  document.getElementById("home").classList.add("hidden");

  document.getElementById("quiz1").classList.add("hidden");

  document.getElementById("quiz1Result").classList.add("hidden");

  document.getElementById("quiz2").classList.add("hidden");

  document.getElementById("quiz2Result").classList.add("hidden");
}


function goHome() {

  hideAll();

  document.getElementById("home").classList.remove("hidden");
}

</script>

</body>
</html>
